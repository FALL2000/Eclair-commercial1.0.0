server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip pour accélérer le chargement sur connexions 3G/4G
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Reverse-proxy vers l'API FastAPI (service "backend" du docker-compose).
    # La résolution DNS se fait à la requête : nginx démarre même si le backend n'est pas encore prêt.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirection des routes Angular vers index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longue durée pour les assets compilés (noms hashés)
    location ~* \.(?:js|css|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
