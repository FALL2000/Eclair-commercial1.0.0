name: CI/CD Pipeline - Eclair Commercial

on:
  push:
    branches:
      - '**' # Se déclenche sur n'importe quelle branche pour la CI
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  # --- PARTIE CI : Tests backend (Pytest, couverture >= 75 % bloquante) ---
  backend-tests:
    name: Backend - Tests Pytest & Couverture (min 75 %)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: eclair_commercial_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: eclair_commercial_ci
      SECRET_KEY: github_actions_ci_secret_key_not_for_production
      APP_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run Pytest (fails if coverage < 75 %)
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # --- PARTIE CI : Build & tests frontend ---
  frontend-build:
    name: Frontend - Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build -- --configuration=production

  # --- PARTIE CD : Build et Push Docker (uniquement sur main) ---
  build-and-push:
    name: Build & Push to DockerHub
    needs: [backend-tests, frontend-build] # On attend obligatoirement que les tests passent au vert
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eclair-commercial-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eclair-commercial-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eclair-commercial-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eclair-commercial-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
